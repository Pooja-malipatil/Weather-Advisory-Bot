# --- wind axis: exhaustive, <25 / 25-45 / >=45 ---

- id: SOP-TR-WIND-01
  category: travel
  title: Manageable wind for travel
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: "<"
        value: 25
  applies_when_activity_hint: [travel, boating, fishing, coastal, general]
  severity: informational
  advice: >
    Wind speed is manageable (under 25 km/h). No specific wind precaution
    needed for travel or coastal activity.

- id: SOP-TR-WIND-02
  category: travel
  title: Moderate wind caution for travel
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: ">="
        value: 25
      - field: wind_speed_10m
        op: "<"
        value: 45
  applies_when_activity_hint: [travel, boating, fishing, coastal, general]
  severity: caution
  advice: >
    Wind speed is moderate (25-45 km/h). High-sided vehicles and small
    boats may be affected; recommend extra caution rather than avoidance.

- id: SOP-TR-WIND-03
  category: travel
  title: Squally / gale-force coastal winds
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: ">="
        value: 45
  applies_when_activity_hint: [travel, boating, fishing, coastal, general]
  severity: severe
  advice: >
    Sustained winds are 45 km/h or higher (squally conditions). Advise
    against sea travel, small-boat operation, or fishing in affected coastal
    waters, and caution for high-sided vehicle travel inland. Recommend
    checking official marine/coastal warnings before heading out.

# -----------------------------------------------------------------------
# CATEGORY: vulnerable_groups  (elderly, children, infant, senior_citizen)
# -----------------------------------------------------------------------

# --- temperature axis: exhaustive, <8 / 8-34 / 34-40 / >=40 ---

- id: SOP-VG-TEMP-01
  category: vulnerable_groups
  title: Cold-weather exposure for children/elderly
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: "<"
        value: 8
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: caution
  advice: >
    Temperature is below 8°C. For elderly people or young children,
    recommend limiting continuous outdoor exposure, dressing in layers, and
    watching for signs of cold discomfort (numbness, shivering, lethargy).

- id: SOP-VG-TEMP-02
  category: vulnerable_groups
  title: Comfortable temperature for elderly/children
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 8
      - field: temperature_2m
        op: "<"
        value: 34
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: informational
  advice: >
    Temperature (8-34°C) is within a comfortable range for elderly people
    or young children to be outside. No specific temperature precaution
    needed beyond normal care.

- id: SOP-VG-TEMP-03
  category: vulnerable_groups
  title: Heat risk for elderly or very young
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 34
      - field: temperature_2m
        op: "<"
        value: 40
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: warning
  advice: >
    Temperature is 34°C or higher. For elderly people, young children, or
    infants, advise limiting outdoor time to short windows, ensuring shade
    and hydration, and avoiding midday hours (12pm-3pm) entirely.

- id: SOP-VG-TEMP-04
  category: vulnerable_groups
  title: Extreme heat risk for elderly or very young
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 40
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: severe
  advice: >
    Temperature is 40°C or higher. Strongly advise against taking elderly
    people, young children, or infants outside at all until temperatures
    drop; heat stroke risk is severe for these groups at this level.

# --- rain axis: exhaustive, <50 / >=50 ---

- id: SOP-VG-RAIN-01
  category: vulnerable_groups
  title: Low-to-moderate rain chance for elderly/children
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: "<"
        value: 50
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: informational
  advice: >
    Rain chance is under 50%. No specific rain precaution needed beyond
    normal care.

- id: SOP-VG-RAIN-02
  category: vulnerable_groups
  title: Moderate-to-high rain chance risk for elderly/children
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: ">="
        value: 50
  applies_when_activity_hint: [elderly, children, infant, senior_citizen, vulnerable]
  severity: caution
  advice: >
    Precipitation probability is 50% or higher. For elderly people or young
    children, recommend avoiding prolonged time outside, ensuring footwear
    has good grip on wet surfaces, and having an indoor fallback plan.

# -----------------------------------------------------------------------
# CATEGORY: pets  (pet, dog, dog_walk, walk_dog)
# -----------------------------------------------------------------------

# --- temperature axis: exhaustive, <=5 / 5-32 / >=32 ---

- id: SOP-PET-TEMP-01
  category: pets
  title: Cold risk for pets
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: "<="
        value: 5
  applies_when_activity_hint: [pet, dog, dog_walk, walk_dog]
  severity: caution
  advice: >
    Air temperature is 5°C or below. Short-haired or small pets can get
    cold quickly; recommend a shorter walk, a coat for cold-sensitive
    breeds, and watching for shivering or reluctance to keep walking.

- id: SOP-PET-TEMP-02
  category: pets
  title: Comfortable pet-walking conditions
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">"
        value: 5
      - field: temperature_2m
        op: "<"
        value: 32
  applies_when_activity_hint: [pet, dog, dog_walk, walk_dog]
  severity: informational
  advice: >
    Conditions are within a comfortable range for walking pets. No specific
    weather precaution required; use general common sense (water, shade on
    longer walks).

- id: SOP-PET-TEMP-03
  category: pets
  title: Hot pavement risk for pets
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 32
  applies_when_activity_hint: [pet, dog, dog_walk, walk_dog]
  severity: caution
  advice: >
    Air temperature is 32°C or higher, meaning pavement/asphalt is likely
    much hotter and can burn paw pads. Recommend walking pets on grass,
    during early morning or evening, or testing pavement heat with the back
    of your hand (5-second rule) before walking on it.

# --- rain axis: exhaustive, <70 / >=70 ---

- id: SOP-PET-RAIN-01
  category: pets
  title: Low-to-moderate rain chance for pets
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: "<"
        value: 70
  applies_when_activity_hint: [pet, dog, dog_walk, walk_dog]
  severity: informational
  advice: >
    Rain chance is under 70%. No specific rain precaution needed for a
    pet walk beyond normal care.

- id: SOP-PET-RAIN-02
  category: pets
  title: High rain chance risk for pets
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: ">="
        value: 70
  applies_when_activity_hint: [pet, dog, dog_walk, walk_dog]
  severity: caution
  advice: >
    Rain chance is 70% or higher. Heavy rain/thunder can stress pets;
    recommend a shorter walk timed between showers, or sticking to a
    sheltered route, rather than a long walk in open rain.

# -----------------------------------------------------------------------
# CATEGORY: outdoor_leisure  (picnic, park, leisure, family_outing) — fuzzy
# -----------------------------------------------------------------------

- id: SOP-LEISURE-GOOD
  category: outdoor_leisure
  title: Good picnic/park day (fuzzy, non-numeric)
  condition_type: fuzzy
  situation_description: >
    The user is asking about a relaxed, low-exertion outdoor leisure activity
    (e.g. picnic, park visit, outdoor family time, outdoor lunch/hangout) and,
    taken together, the fetched conditions paint an overall pleasant picture
    for sitting/lounging outdoors for a few hours: no active rain or high
    rain probability, no extreme heat or cold, no high wind, and no severe
    weather system in effect. There is no single hard threshold here — use
    judgment about whether the *overall* conditions would make a few hours
    outdoors pleasant versus merely "not technically dangerous."
  applies_when_activity_hint: [picnic, park, leisure, family_outing, outdoor_leisure]
  severity: informational
  advice: >
    Overall conditions look pleasant for a low-exertion outdoor outing like a
    picnic or park visit. Mention the specific numbers that support this
    (temperature, rain chance, wind) and suggest normal precautions (shade,
    water, sun protection appropriate to time of day) rather than a
    specific hazard.

- id: SOP-LEISURE-MARGINAL
  category: outdoor_leisure
  title: Marginal / mixed-signal leisure day (fuzzy, non-numeric)
  condition_type: fuzzy
  situation_description: >
    The user is asking about a relaxed outdoor leisure activity (picnic, park,
    family outing) but the conditions are mixed or borderline: e.g. moderate
    rain chance (roughly 30-70%), somewhat high heat or wind that is not
    severe enough to trigger a hard-safety SOP, or a forecast that could turn
    either way within the visit window. This is not "dangerous" but it is not
    a clearly good day either, and a generic optimistic answer would be
    misleading.
  applies_when_activity_hint: [picnic, park, leisure, family_outing, outdoor_leisure]
  severity: caution
  advice: >
    Conditions are mixed/borderline for a relaxed outdoor outing — not
    unsafe, but not clearly pleasant either. Name the specific mixed signal
    (e.g. moderate rain chance, warm-but-not-extreme heat) and recommend a
    backup plan (shade/shelter nearby, a flexible time window, or checking
    the forecast again closer to the time) rather than a flat yes or no.

- id: SOP-LEISURE-POOR
  category: outdoor_leisure
  title: Poor day for outdoor leisure (fuzzy, non-numeric)
  condition_type: fuzzy
  situation_description: >
    The user is asking about a relaxed outdoor leisure activity (picnic,
    park, family outing) and conditions are genuinely unpleasant for sitting
    outside for an extended period — e.g. high rain probability (roughly
    70%+), very high or very low temperature, or high wind — even if no
    single number is extreme enough to count as an active severe weather
    system. This is a step below SOP-SEVERE-SYSTEM (no flagged system, just
    an uncomfortable/impractical day) but a step above "marginal": a
    reasonable person would actively choose to reschedule rather than go.
  applies_when_activity_hint: [picnic, park, leisure, family_outing, outdoor_leisure]
  severity: warning
  advice: >
    Conditions are poor for a relaxed outdoor outing today. Name the
    specific driving factor (heavy rain chance, extreme heat/cold, or high
    wind) and recommend rescheduling to a different day or moving the plan
    indoors rather than pushing ahead.

# -----------------------------------------------------------------------
# CATEGORY: severe_weather_system — override, unchanged
# -----------------------------------------------------------------------
# If this matches, graph/sop_matcher.py::resolve() suppresses every other
# match above (checked by category name, so this behavior is automatic for
# any future SOP added to this same category).

- id: SOP-SEVERE-SYSTEM
  category: severe_weather_system
  title: Active flagged severe weather system overrides category-specific advice
  condition_type: fuzzy
  situation_description: >
    A well-marked low-pressure area, depression, cyclonic circulation, or
    similarly named/flagged weather system (as would be reported by a
    meteorological authority such as the IMD) is actively affecting the
    user's location, bringing heavy to very heavy rainfall, or squally/
    gale-force winds are affecting the user's coastal area — REGARDLESS of
    whether the specific numeric fields pulled from the forecast look
    extreme in isolation. The signal for this is a combination of clearly
    elevated precipitation and/or precipitation probability sustained across
    the day (not just the current instant) alongside high wind, OR explicit
    mention in the fetched data/user context of a named system. Recognize
    this as a *situational* risk that is bigger than any single field.
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, travel,
    commute, driving, walking, boating, fishing, coastal, picnic, park, leisure,
    family_outing, outdoor_leisure, elderly, children, infant, senior_citizen,
    vulnerable, pet, dog, dog_walk, walk_dog, outdoor_general, general]
  severity: severe
  advice: >
    An active severe weather system (heavy rainfall event and/or squally
    winds) is affecting the location. This overrides category-specific
    advice: lead with the rain/wind system itself — what it is, and that it
    is officially flagged/active — before any activity-specific comment.
    Advise deferring the planned outdoor activity, of any kind, until the
    system passes, and to check official advisories for updates.