# =============================================================================
# Standard Operating Procedures (SOPs) — Weather-Advisory Support Bot
# =============================================================================
# DESIGN PRINCIPLE (why this file looks the way it does):
# Every numeric hazard axis a category cares about (temperature, wind,
# rain chance, UV) is covered by a set of SOPs whose ranges PARTITION the
# entire scale with no gaps and no overlaps within that axis — e.g. for
# outdoor_exercise temperature: <0, 0-10, 10-32, 32-38, >=38 covers every
# possible reading. Axes are independent of each other (a temperature SOP
# doesn't also check wind), so several SOPs can legitimately match the same
# question at once (e.g. warm temperature + high rain chance). That's
# expected and handled by graph/sop_matcher.py's existing resolve() function
# (severity-ranked primary + "also relevant" mentions) — NO CODE CHANGES
# were needed for this file; only the YAML changed.
#
# This design is what fixes the earlier bug class: previously some SOPs used
# combined AND-conditions across multiple fields (e.g. "comfortable" needed
# temp AND wind AND rain AND UV all in range simultaneously), which created
# dead zones where a value fell between two AND-combinations and matched
# nothing. Splitting each axis into its own independent, exhaustive band
# eliminates dead zones by construction.
#
# condition_type values (unchanged from before, still 2 supported):
#   numeric -> {field, op, value} clauses evaluated deterministically in
#              plain Python (graph/sop_matcher.py). The LLM never evaluates
#              thresholds.
#   fuzzy   -> situation_description handed to the LLM as a candidate; it
#              must return a real id from the closed candidate list or
#              NO_MATCH (graph/llm.py::pick_fuzzy_sop).
#
# severity: informational | caution | warning | severe
# =============================================================================

# -----------------------------------------------------------------------
# CATEGORY: outdoor_exercise  (cycling, running, hiking, sports, general)
# -----------------------------------------------------------------------

# --- temperature axis: exhaustive, <0 / 0-10 / 10-32 / 32-38 / >=38 ---

- id: SOP-EX-TEMP-01
  category: outdoor_exercise
  title: Extreme cold exertion risk
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: "<"
        value: 0
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: severe
  advice: >
    Temperature is below 0°C. Advise against strenuous outdoor exercise;
    risk of frostbite/hypothermia with prolonged exposure. If unavoidable,
    recommend layered clothing, covering extremities, and limiting duration.

- id: SOP-EX-TEMP-02
  category: outdoor_exercise
  title: Cold exertion caution
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 0
      - field: temperature_2m
        op: "<"
        value: 10
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: caution
  advice: >
    Temperature is between 0°C and 10°C. Recommend warming up thoroughly,
    dressing in layers, and being mindful of reduced grip/traction risk on
    cold surfaces.

- id: SOP-EX-TEMP-03
  category: outdoor_exercise
  title: Comfortable exertion temperature
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 10
      - field: temperature_2m
        op: "<"
        value: 32
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: informational
  advice: >
    Temperature (10-32°C) is within a comfortable range for outdoor
    exercise. No specific temperature precaution needed; use general
    common sense (hydration, appropriate footwear for terrain).

- id: SOP-EX-TEMP-04
  category: outdoor_exercise
  title: Warm-but-not-extreme exertion caution
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 32
      - field: temperature_2m
        op: "<"
        value: 38
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: caution
  advice: >
    Temperature is between 32°C and 38°C. Not extreme, but warm enough that
    prolonged exertion carries real heat-strain risk. Recommend hydrating
    well, taking breaks in shade, and avoiding peak midday hours if possible.

- id: SOP-EX-TEMP-05
  category: outdoor_exercise
  title: Extreme heat exertion risk
  condition_type: numeric
  condition:
    all:
      - field: temperature_2m
        op: ">="
        value: 38
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: severe
  advice: >
    Temperature is at or above 38°C. Advise against strenuous outdoor
    exercise at this time. Recommend rescheduling to cooler hours, hydrating
    well, and watching for signs of heat exhaustion if activity cannot be
    postponed.

# --- wind axis: exhaustive, <25 / 25-40 / >=40 (two-wheeler + exposed activities) ---

- id: SOP-EX-WIND-01
  category: outdoor_exercise
  title: Manageable wind for exercise
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: "<"
        value: 25
  applies_when_activity_hint: [cycling, running, hiking, sports]
  severity: informational
  advice: >
    Wind speed is manageable (under 25 km/h). No specific wind precaution
    needed for cycling, running, or hiking.

- id: SOP-EX-WIND-02
  category: outdoor_exercise
  title: Moderate wind caution
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: ">="
        value: 25
      - field: wind_speed_10m
        op: "<="
        value: 40
  applies_when_activity_hint: [cycling, running, hiking, sports]
  severity: caution
  advice: >
    Wind speed is moderate (25-40 km/h). Cycling and exposed-ridge hiking
    may feel harder or less stable than usual; recommend a sheltered route
    or extra caution on exposed sections, not outright avoidance.

- id: SOP-EX-WIND-03
  category: outdoor_exercise
  title: High wind safety risk
  condition_type: numeric
  condition:
    all:
      - field: wind_speed_10m
        op: ">"
        value: 40
  applies_when_activity_hint: [cycling, motorbike, scooter, two_wheeler, hiking, running]
  severity: warning
  advice: >
    Wind speed exceeds 40 km/h. Flag this as a genuine safety risk (loss of
    control on a two-wheeler, debris, instability on exposed hiking terrain),
    not merely a comfort issue. Recommend postponing or choosing a sheltered
    route.

# --- UV axis: exhaustive, <8 / >=8 ---

- id: SOP-EX-UV-01
  category: outdoor_exercise
  title: UV within normal range
  condition_type: numeric
  condition:
    all:
      - field: uv_index
        op: "<"
        value: 8
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: informational
  advice: >
    UV index is below 8. Normal sun precautions (sunscreen if out for a
    while) are enough; no need to reschedule around UV specifically.

- id: SOP-EX-UV-02
  category: outdoor_exercise
  title: High UV during peak hours
  condition_type: numeric
  condition:
    all:
      - field: uv_index
        op: ">="
        value: 8
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: warning
  advice: >
    UV index is at or above 8. Advise against unprotected outdoor exercise
    between 11am and 4pm. Recommend sunscreen (SPF 30+), sunglasses, and a
    hat if going out anyway, or rescheduling to early morning or evening.

# --- rain axis: exhaustive, <30 / 30-70 / >=70 ---

- id: SOP-EX-RAIN-01
  category: outdoor_exercise
  title: Low rain chance for exercise
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: "<"
        value: 30
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: informational
  advice: >
    Rain chance is low (under 30%). No specific rain precaution needed.

- id: SOP-EX-RAIN-02
  category: outdoor_exercise
  title: Marginal rain chance for exercise
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: ">="
        value: 30
      - field: precipitation_probability
        op: "<"
        value: 70
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: caution
  advice: >
    There is a moderate (30-70%) chance of rain. Not dangerous, but bring
    rain-appropriate gear, check the forecast again closer to departure, and
    have a shorter/indoor backup plan rather than assuming clear conditions.

- id: SOP-EX-RAIN-03
  category: outdoor_exercise
  title: High rain chance for exercise
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: ">="
        value: 70
  applies_when_activity_hint: [exercise, cycling, running, hiking, sports, outdoor_general]
  severity: warning
  advice: >
    Rain chance is 70% or higher. Warn of likely wet, slippery conditions
    and reduced visibility for outdoor exercise. Recommend rescheduling or
    choosing a covered/indoor alternative if the activity can be moved.

# -----------------------------------------------------------------------
