# --- rain axis: exhaustive, <30 / 30-70 / >=70 ---

- id: SOP-TR-RAIN-01
  category: travel
  title: Low rain chance for travel
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: "<"
        value: 30
  applies_when_activity_hint: [travel, commute, driving, walking, general]
  severity: informational
  advice: >
    Rain chance is low (under 30%). No specific travel precaution needed.

- id: SOP-TR-RAIN-02
  category: travel
  title: Moderate rain chance affecting travel
  condition_type: numeric
  condition:
    all:
      - field: precipitation_probability
        op: ">="
        value: 30
      - field: precipitation_probability
        op: "<"
        value: 70
  applies_when_activity_hint: [travel, commute, driving, walking, general]
  severity: caution
  advice: >
    There is a moderate (30-70%) chance of rain. Recommend allowing a bit
